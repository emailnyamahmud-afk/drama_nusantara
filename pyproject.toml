[project]
name = "drama-nusantara-tui"
version = "0.1.0"
description = "TUI untuk produksi drama sejarah Nusantara berbahasa Jawa Krama Inggil. Generate naskah, storyboard, dan JSON spec siap pakai di Google Flow + Omni 1.1 Flash."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Drama Nusantara Team" }
]
requires-python = ">=3.10"
keywords = ["drama", "nusantara", "jawa", "krama", "panatacara", "google-flow", "omni", "veo", "ai-video", "shorts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Indonesian",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "click>=8.1.0",
    "questionary>=2.0.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "google-generativeai>=0.7.0",
    "pillow>=10.2.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[project.scripts]
drama-tui = "drama_nusantara_tui.cli:main"

[project.urls]
Homepage = "https://github.com/drama-nusantara/drama-tui"
Repository = "https://github.com/drama-nusantara/drama-tui"
Issues = "https://github.com/drama-nusantara/drama-tui/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drama_nusantara_tui"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
